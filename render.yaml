# Render Blueprint: Render bu dosyayı okuyup sunucuyu kendisi kurar.
# Render panelinde: New > Blueprint > bu depoyu seç > Apply
services:
  - type: web
    name: hudut
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: WEAPON_INTERVAL_SEC
        value: "30"
